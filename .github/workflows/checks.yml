name: Compatibility checks

on:
    workflow_call:

permissions:
    contents: read

jobs:
    compatibility:
        name: Node ${{ matrix.node }} / Prettier ${{ matrix.prettier }} / ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                node: ["22", "24", "26"]
                prettier: ["3.8.1", "3"]
                include:
                    - os: windows-latest
                      node: "24"
                      prettier: "3"
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - name: Select Prettier within the supported major
              run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@${{ matrix.prettier }}
            - name: Report actual versions
              run: node -e "console.log(process.version, 'Prettier', require('prettier/package.json').version); console.log('PostCSS', require('postcss/package.json').version, 'postcss-scss', require('postcss-scss/package.json').version)"
            - run: npm test
            - run: npm run test:types
            - run: npm run test:package
            - name: Install browser smoke runtime
              if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
              run: npx playwright install --with-deps chromium
            - name: Compare standalone browser and Node output
              if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
              run: npm run test:browser -- --output browser-results.json
            - uses: actions/upload-artifact@v7
              if: always() && matrix.node == '24' && matrix.os == 'ubuntu-latest'
              with:
                  name: browser-results-prettier-${{ matrix.prettier }}
                  path: |
                      browser-results.json
                      browser-results.evidence/*.json
                  if-no-files-found: error
                  retention-days: 14

    benchmark:
        name: Sorting benchmark (informational)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            BENCHMARK_BASELINE: dad2aa8dd42553c15dd7c021043a04d214f1ad37
        steps:
            - uses: actions/checkout@v6
            - name: Fetch pinned benchmark baseline
              run: git fetch --no-tags --depth=1 origin "$BENCHMARK_BASELINE"
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: Verify pinned real-file corpus
              run: npm run test:corpus -- --output corpus-results.json
            - name: Compare sorting against pinned baseline
              run: npm run benchmark -- --compare "$BENCHMARK_BASELINE" --metric all --output benchmark-results.json
            - uses: actions/upload-artifact@v7
              with:
                  name: benchmark-results
                  path: benchmark-results.json
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-artifact@v7
              with:
                  name: corpus-results
                  path: corpus-results.json
                  if-no-files-found: error
                  retention-days: 14
